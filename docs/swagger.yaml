definitions:
  podman.PortMapping:
    properties:
      containerPort:
        description: required
        format: int32
        type: integer
      hostIP:
        description: '"" = all interfaces; use "127.0.0.1" for this machine only'
        type: string
      hostPort:
        description: 0 = Podman picks a free port
        format: int32
        type: integer
      protocol:
        description: '"tcp" (default), "udp" or "sctp"'
        type: string
    type: object
  server.createContainerRequest:
    properties:
      env:
        additionalProperties:
          type: string
        type: object
      image:
        type: string
      name:
        type: string
      ports:
        items:
          $ref: '#/definitions/podman.PortMapping'
        type: array
      start:
        type: boolean
    type: object
